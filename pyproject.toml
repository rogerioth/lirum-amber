[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lirum-amber"
version = "0.1.0"
description = "Lirum Amber — a TUI and CLI for 200+ string operations, by Lirum Labs"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
amber = "main:main"

[tool.setuptools.packages.find]
include = ["string_ops*", "tui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
