[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "string-ops-tui"
version = "0.1.0"
description = "A TUI application for performing string operations"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
string-ops = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
